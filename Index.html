<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1E4A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Turnos de uñas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1F7;--surface:#FFFFFF;--ink:#2B1635;--muted:#6F5C79;--accent:#6B1E4A;--on-accent:#FFFFFF;--line:#E2D6E8;--mint:#CFEFE3;--danger:#A3282F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1024;--surface:#2A1834;--ink:#F5ECF8;--muted:#B9A5C4;--accent:#E7A6CC;--on-accent:#2B1635;--line:#43294F;--mint:#1F4A3D;--danger:#FF8D93}}
:root[data-theme="dark"]{--bg:#1D1024;--surface:#2A1834;--ink:#F5ECF8;--muted:#B9A5C4;--accent:#E7A6CC;--on-accent:#2B1635;--line:#43294F;--mint:#1F4A3D;--danger:#FF8D93;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:2rem;line-height:1.05;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
h2{font-size:1.15rem;font-weight:600;margin:26px 0 10px}
p.sub{margin:0;color:var(--muted);max-width:46ch}
.stage{margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 10px 14px;text-align:center}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.hand svg{width:17%;max-width:74px;height:auto;transition:transform .25s}
.hand svg:nth-child(1){transform:scale(.8)}.hand svg:nth-child(2){transform:scale(.94)}
.hand svg:nth-child(3){transform:scale(1.04)}.hand svg:nth-child(4){transform:scale(.96)}
.hand svg:nth-child(5){transform:scale(.78)}
.stage .name{margin:10px 0 0;font-weight:600}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shape{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px 8px;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.shape svg{width:34px;height:56px;display:block;margin:0 auto 4px}
.shape span{font-size:.85rem}
.shape[aria-pressed="true"]{border-color:var(--accent);background:var(--mint)}
.colors{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-weight:600;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 0;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.pick{background:var(--mint);border-radius:16px;padding:12px 14px;margin-top:18px;display:flex;gap:12px;align-items:center}
.pick svg{width:26px;height:44px;flex:none}
.btn{display:block;width:100%;font:inherit;font-weight:600;border:0;border-radius:16px;padding:15px;margin-top:18px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.msg{margin-top:12px;font-weight:600}.msg.err{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.card b{display:block}.card small{color:var(--muted)}
.card .row{display:flex;gap:8px;margin-top:10px}
.card .row button{flex:1;font:inherit;font-weight:600;border-radius:12px;padding:10px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.card .row .del{color:var(--danger)}
.empty{color:var(--muted);padding:20px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 0;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);background:var(--bg)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="v-formas">
    <h1>Elegí tu forma y color</h1>
    <p class="sub">Probá combinaciones y reservá el turno con tu diseño ya elegido.</p>
    <div class="stage"><div class="hand" id="hand" aria-hidden="true"></div><p class="name" id="pickName"></p></div>
    <h2>Forma</h2><div class="shapes" id="shapes"></div>
    <h2>Color</h2><div class="colors" id="colors"></div>
    <button class="btn" id="goTurno">Reservar con este diseño</button>
  </section>

  <section id="v-turno" class="hide">
    <h1>Reservá tu turno</h1>
    <p class="sub">Completá tus datos y elegí día y horario.</p>
    <div class="pick"><span id="miniNail"></span><span id="pickText"></span></div>
    <label for="nombre">Nombre</label><input id="nombre" autocomplete="name">
    <label for="tel">Teléfono</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel">
    <label for="serv">Servicio</label>
    <select id="serv"><option>Semipermanente</option><option>Esculpidas</option><option>Capping</option><option>Esmaltado tradicional</option><option>Retiro de uñas</option></select>
    <label for="fecha">Día</label><input id="fecha" type="date">
    <label>Horario</label><div class="slots" id="slots"></div>
    <label for="nota">Comentarios (opcional)</label><textarea id="nota"></textarea>
    <button class="btn" id="save">Confirmar turno</button>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section id="v-mis" class="hide">
    <h1>Mis turnos</h1>
    <p class="sub">Los turnos se guardan en este dispositivo.</p>
    <div id="list" style="margin-top:16px"></div>
  </section>
</main>

<nav role="tablist" aria-label="Secciones">
  <button role="tab" data-v="formas" aria-selected="true">Formas</button>
  <button role="tab" data-v="turno" aria-selected="false">Turno</button>
  <button role="tab" data-v="mis" aria-selected="false">Mis turnos</button>
</nav>

<script>
// Poné acá tu número de WhatsApp con código de país, sin + ni espacios (ej: 5492611234567). Si lo dejás vacío, vas a elegir el contacto al enviar.
var WHATSAPP = "5492616425626";

var SHAPES = [
 {id:"cuadrada",n:"Cuadrada",d:"M12 98V28Q12 20 20 20H40Q48 20 48 28V98Z"},
 {id:"redonda",n:"Redonda",d:"M12 98V40Q12 18 30 18Q48 18 48 40V98Z"},
 {id:"ovalada",n:"Ovalada",d:"M12 98V46Q12 8 30 8Q48 8 48 46V98Z"},
 {id:"almendra",n:"Almendra",d:"M12 98Q12 52 26 12Q30 4 34 12Q48 52 48 98Z"},
 {id:"bailarina",n:"Bailarina",d:"M12 98L16 30L24 12H36L44 30L48 98Z"},
 {id:"stiletto",n:"Stiletto",d:"M12 98Q14 60 30 0Q46 60 48 98Z"}
];
var COLORS = [
 {n:"Rosa nude",c:"#E8B7B0"},{n:"Rojo cereza",c:"#B5172F"},{n:"Bordó",c:"#6B1E3A"},
 {n:"Lila",c:"#B79CE0"},{n:"Menta",c:"#8ED6BC"},{n:"Celeste",c:"#8CC4EE"},
 {n:"Blanco perla",c:"#F4EEE6"},{n:"Negro",c:"#1E1A22"}
];
var SLOTS = ["09:00","10:00","11:00","12:00","14:00","15:00","16:00","17:00","18:00","19:00"];
var state = {shape:SHAPES[3],color:COLORS[0],hora:"",turnos:[]};
var $ = function(id){return document.getElementById(id)};

function load(){try{state.turnos = JSON.parse(localStorage.getItem("turnos")||"[]")}catch(e){state.turnos=[]}}
function persist(){try{localStorage.setItem("turnos",JSON.stringify(state.turnos))}catch(e){}}

function nailSvg(shape,color,w){
  return '<svg viewBox="0 0 60 100" '+(w?'width="'+w+'"':'')+' xmlns="http://www.w3.org/2000/svg"><path d="'+shape.d+'" fill="'+color+'" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/><path d="M20 90V40" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>';
}
function render(){
  var h="";for(var i=0;i<5;i++)h+=nailSvg(state.shape,state.color.c);
  $("hand").innerHTML=h;
  var t=state.shape.n+" · "+state.color.n;
  $("pickName").textContent=t;
  $("pickText").textContent=t;
  $("miniNail").innerHTML=nailSvg(state.shape,state.color.c,26);
  document.querySelectorAll(".shape").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.id===state.shape.id)});
  document.querySelectorAll(".sw").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.n===state.color.n)});
}
function build(){
  $("shapes").innerHTML=SHAPES.map(function(s){return '<button class="shape" data-id="'+s.id+'" aria-pressed="false">'+nailSvg(s,"var(--line)")+'<span>'+s.n+'</span></button>'}).join("");
  $("colors").innerHTML=COLORS.map(function(c){return '<button class="sw" data-n="'+c.n+'" aria-label="'+c.n+'" aria-pressed="false" style="background:'+c.c+'"></button>'}).join("");
  $("shapes").onclick=function(e){var b=e.target.closest(".shape");if(!b)return;state.shape=SHAPES.filter(function(s){return s.id===b.dataset.id})[0];render()};
  $("colors").onclick=function(e){var b=e.target.closest(".sw");if(!b)return;state.color=COLORS.filter(function(c){return c.n===b.dataset.n})[0];render()};
}
function slots(){
  var f=$("fecha").value;
  var taken=state.turnos.filter(function(t){return t.fecha===f}).map(function(t){return t.hora});
  if(taken.indexOf(state.hora)>-1)state.hora="";
  $("slots").innerHTML=SLOTS.map(function(s){return '<button class="slot" data-h="'+s+'" aria-pressed="'+(s===state.hora)+'"'+(taken.indexOf(s)>-1?" disabled":"")+'>'+s+'</button>'}).join("");
}
function fmt(f){var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function msg(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}
function wa(t){
  var txt="Hola, quiero confirmar mi turno de uñas: "+t.serv+", forma "+t.forma+", color "+t.color+", el "+fmt(t.fecha)+" a las "+t.hora+". Soy "+t.nombre+".";
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(txt),"_blank");
}
function list(){
  var arr=state.turnos.slice().sort(function(a,b){return (a.fecha+a.hora)<(b.fecha+b.hora)?-1:1});
  if(!arr.length){$("list").innerHTML='<p class="empty">Todavía no tenés turnos. Elegí una forma y reservá el primero.</p>';return}
  $("list").innerHTML=arr.map(function(t){return '<div class="card"><b>'+fmt(t.fecha)+' · '+t.hora+'</b>'+esc(t.serv)+' · '+esc(t.forma)+', '+esc(t.color)+'<br><small>'+esc(t.nombre)+' · '+esc(t.tel)+'</small><div class="row"><button data-wa="'+t.id+'">Enviar por WhatsApp</button><button class="del" data-del="'+t.id+'">Cancelar</button></div></div>'}).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(v){
  ["formas","turno","mis"].forEach(function(x){$("v-"+x).classList.toggle("hide",x!==v)});
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===v)});
  if(v==="mis")list();if(v==="turno")slots();
  window.scrollTo(0,0);
}

load();build();render();
var d=new Date();$("fecha").min=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
document.querySelector("nav").onclick=function(e){var b=e.target.closest("button");if(b)show(b.dataset.v)};
$("goTurno").onclick=function(){show("turno")};
$("fecha").onchange=slots;
$("slots").onclick=function(e){var b=e.target.closest(".slot");if(!b||b.disabled)return;state.hora=b.dataset.h;slots()};
$("save").onclick=function(){
  var t={id:String(Date.now()),nombre:$("nombre").value.trim(),tel:$("tel").value.trim(),serv:$("serv").value,fecha:$("fecha").value,hora:state.hora,forma:state.shape.n,color:state.color.n,nota:$("nota").value.trim()};
  if(!t.nombre||!t.tel){msg("Completá tu nombre y teléfono.",true);return}
  if(!t.fecha){msg("Elegí un día.",true);return}
  if(!t.hora){msg("Elegí un horario.",true);return}
  state.turnos.push(t);persist();msg("Turno guardado. Podés enviarlo por WhatsApp desde Mis turnos.");
  $("nombre").value="";$("tel").value="";$("nota").value="";state.hora="";slots();
  setTimeout(function(){show("mis")},900);
};
$("list").onclick=function(e){
  var w=e.target.closest("[data-wa]"),x=e.target.closest("[data-del]");
  if(w){var t=state.turnos.filter(function(t){return t.id===w.dataset.wa})[0];if(t)wa(t)}
  if(x){state.turnos=state.turnos.filter(function(t){return t.id!==x.dataset.del});persist();list()}
};
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
